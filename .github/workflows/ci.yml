name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Qualité du code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installer les dépendances
        run: npm install

      - name: Lint (ESLint)
        run: npm run lint

      - name: Vérification des types (TypeScript)
        run: npm run typecheck

      - name: Tests unitaires (Vitest)
        run: npm run test

      - name: Build de validation (Next.js)
        run: npm run build
        env:
          # Variables requises pour le build Next.js
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: https://le-rameau.vercel.app
          NEXT_PUBLIC_APP_NAME: "Le Rameau"
